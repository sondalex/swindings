<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{ title }}</title>
        <meta name="description" content="{{ description }}" />
    </head>
    <body class="font-sans antialiased">
        <div hidden=""><!--$--><!--/$--></div>
        <div class="min-h-screen bg-background">
            <header
                class="sticky top-0 z-50 w-full border-b border-border bg-background/80 backdrop-blur-sm"
            >
                <div
                    class="mx-auto flex h-14 max-w-5xl items-center justify-between px-4"
                >
                    <a class="flex items-center gap-2 font-semibold" href="{{ basePath }}">
                        <span class="inline-flex h-6 w-6 items-center justify-center rounded border border-border bg-muted text-muted-foreground font-mono text-xs font-bold shadow-[0_2px_0_0_rgba(0,0,0,0.5)]">S</span>
                        <span>{{ title }}</span>
                    </a>
                    <nav class="flex items-center gap-6">
                        <a
                            class="text-sm text-muted-foreground transition-colors hover:text-foreground"
                            href="#about"
                            >About</a
                        >
                        <a
                            class="text-sm text-muted-foreground transition-colors hover:text-foreground"
                            href="#installation"
                            >Installation</a
                        >
                        <a
                            target="_blank"
                            rel="noopener noreferrer"
                            class="flex items-center gap-1.5 text-sm text-muted-foreground transition-colors hover:text-foreground"
                            href="{{ githubUrl }}"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                class="lucide lucide-github h-4 w-4"
                                aria-hidden="true"
                            >
                                <path
                                    d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
                                ></path>
                                <path d="M9 18c-4.51 2-5-2-7-2"></path>
                            </svg>
                            <span class="hidden sm:inline">GitHub</span>
                        </a>
                    </nav>
                </div>
            </header>
            <main>
                <section class="relative overflow-hidden px-4 py-24 sm:py-32">
                    <div class="absolute inset-0 -z-10">
                        <div
                            class="absolute inset-0 bg-[linear-gradient(to_right,rgb(255_255_255/0.03)_1px,transparent_1px),linear-gradient(to_bottom,rgb(255_255_255/0.03)_1px,transparent_1px)] bg-[size:64px_64px]"
                        ></div>
                        <div
                            class="absolute left-1/2 top-0 -z-10 h-[600px] w-[600px] -translate-x-1/2 rounded-full bg-accent/5 blur-3xl"
                        ></div>
                    </div>
                    <div class="mx-auto max-w-3xl text-center">
                        <span
                            data-slot="badge"
                            class="inline-flex items-center justify-center rounded-md border px-2 py-0.5 text-xs font-medium w-fit whitespace-nowrap shrink-0 [&amp;&gt;svg]:size-3 gap-1 [&amp;&gt;svg]:pointer-events-none focus-visible:border-ring focus-visible:ring-ring/50 focus-visible:ring-[3px] aria-invalid:ring-destructive/20 dark:aria-invalid:ring-destructive/40 aria-invalid:border-destructive transition-[color,box-shadow] overflow-hidden [a&amp;]:hover:bg-secondary/90 mb-6 border-border bg-secondary text-muted-foreground"
                            >{{ version }} — Now Available</span
                        >
                        <h1
                            class="mb-6 text-balance text-4xl font-bold tracking-tight text-foreground sm:text-5xl lg:text-6xl"
                        >
                            {{ title }}
                        </h1>
                        <p
                            class="mx-auto mb-10 max-w-2xl text-pretty text-lg leading-relaxed text-muted-foreground"
                        >
                            {{ description }}
                        </p>
                        <div class="mx-auto max-w-xl" id="installation">
                            <p
                                class="mb-3 text-sm font-medium text-muted-foreground"
                            >
                                Install with a single command:
                            </p>
                            <div
                                class="group relative flex items-center gap-3 rounded-lg border border-border bg-card px-4 py-3 font-mono text-sm transition-colors hover:border-muted-foreground/50"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="24"
                                    height="24"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    class="lucide lucide-terminal h-4 w-4 shrink-0 text-muted-foreground"
                                    aria-hidden="true"
                                >
                                    <path d="M12 19h8"></path>
                                    <path d="m4 17 6-6-6-6"></path>
                                </svg>
                                <code class="flex-1 text-foreground"
                                    >{{ installCommand }}</code
                                >
                                <button
                                    class="shrink-0 rounded-md p-1.5 text-muted-foreground transition-colors hover:bg-secondary hover:text-foreground"
                                    aria-label="Copy to clipboard"
                                >
                                    <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        width="24"
                                        height="24"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        class="lucide lucide-copy h-4 w-4"
                                        aria-hidden="true"
                                    >
                                        <rect
                                            width="14"
                                            height="14"
                                            x="8"
                                            y="8"
                                            rx="2"
                                            ry="2"
                                        ></rect>
                                        <path
                                            d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                                        ></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div
                            class="mt-8 flex flex-wrap items-center justify-center gap-x-8 gap-y-4 text-sm text-muted-foreground"
                        >
                            <div class="flex items-center gap-2">
                                <span
                                    class="h-2 w-2 rounded-full bg-accent"
                                ></span>
                                <span>Linux</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span
                                    class="h-2 w-2 rounded-full bg-accent"
                                ></span>
                                <span>{{ license }} Licensed</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span
                                    class="h-2 w-2 rounded-full bg-accent"
                                ></span>
                                <span>Open Source</span>
                            </div>
                        </div>
                    </div>
                </section>
                <section id="about" class="border-t border-border px-4 py-20">
                    <h1>Enter a video caption or gif here.</h1>
                </section>
            </main>
            <footer class="border-t border-border px-4 py-12">
                <div class="mx-auto max-w-5xl">
                    <div
                        class="mt-8 flex flex-wrap items-center justify-center"
                    >
                        <p
                            class="mt-8 text-center text-sm text-muted-foreground"
                        >
                            Made with care by&nbsp;<a
                                target="_blank"
                                rel="noopener noreferrer"
                                class="inline underline"
                                href="{{ authorProfileURL }}"
                                >{{ author }}</a
                            >
                        </p>
                    </div>
                </div>
            </footer>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
